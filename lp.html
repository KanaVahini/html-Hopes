<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        body{
            background-color: #1a1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display:flex ;
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color: #d17272ad;
            border-radius: 10px;
            padding: 40px;
            width: 290px;
        }
        h1{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        h2{
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input{
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid black ;
            border-radius: 6px;
            background-color: white;
        }
        button{
            font-weight: bold;
            background-color: rgb(160, 203, 224);
            color: rgb(29, 30, 31);
            margin: 10px;
            padding: 10px;
        }
        button:hover{
            background-color: rgb(28, 128, 132);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 style="color: rgb(15, 15, 95);">    Hi ROHITH :)   </h1>
        <h2 style="color: rgb(171, 62, 62);">Login here!</h1>
    <form>
        <input type="email" name="" id="" placeholder="Email">
        <input type="password" name="" id="" placeholder="Password:)">
        <button type="submit">Click here to Login</button>
    </form>
    </div>
</body>

</html>
